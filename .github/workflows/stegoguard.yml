name: StegoGuard Image Forensics

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image-forensics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show lab mode
        run: cat lab_mode.txt

      - name: Create demo image
        run: python make_demo_image.py

      - name: Check created image
        run: ls -la images

      - name: Commit generated image to repo
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/student_image.png
          git commit -m "Add generated student image" || echo "No changes to commit"
          git push

      - name: Run StegoGuard scanner
        run: python scanner.py
